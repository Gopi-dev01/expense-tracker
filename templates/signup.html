<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup | Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>


 {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div id="messageModal" class="modal-overlay show">
      <div class="custom-modal">
        <h3>Notification</h3>
        {% for category, message in messages %}
          <p class="alert {{ category }}">{{ message }}</p>
        {% endfor %}
        <div class="modal-actions">
          <button class="btn btn-primary" onclick="closeMessageModal()">OK</button>
        </div>
      </div>
    </div>
  {% endif %}
{% endwith %}


<nav class="navbar">
    <div class="logo" style="display: flex; align-items: center; gap: 5px;"><img src="{{ url_for('static', filename='images/logo.png', v='10') }}" alt="Logo" style="height: 55px; width: 55px; object-fit: contain; margin-right: -16px; transform: translateY(-6px);"><span>Expense Tracker</span></div>
    <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>
    <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/login">Login</a></li>
    </ul>
</nav>

<div class="auth-container">
    <div class="auth-card">
        <h2>Create Account</h2>

        <form method="POST" action="/signup" onsubmit="return validateSignupForm()">
            <input type="text" name="name" placeholder="Full Name" required oninput="validateName(this)">
            <input type="email" name="email" placeholder="Email Address" required oninput="validateEmail(this)">
            <div class="password-container">
                <input type="password" name="password" placeholder="Password" required oninput="validatePassword(this)">
                <i class="eye-icon" onclick="togglePassword(this)">&#128065;</i>
            </div>

            <button type="submit" class="btn-primary full-btn">
                Signup
            </button>
        </form>

        <p class="auth-link">
            Already have an account?
            <a href="/login">Login</a>
        </p>
    </div>
</div>

<script>


    function closeMessageModal() {
        document.getElementById('messageModal').classList.remove('show');
    }

    function togglePassword(icon) {
        const input = icon.previousElementSibling;
        input.type = input.type === 'password' ? 'text' : 'password';
        icon.textContent = input.type === 'password' ? '👁️' : '🙈';
    }

    function validateName(input) {
        const value = input.value;
        const regex = /^[a-zA-Z\s]+$/;
        if (!regex.test(value) && value !== '') {
            input.setCustomValidity('Name should contain only letters and spaces.');
        } else {
            input.setCustomValidity('');
        }
    }

    function validateEmail(input) {
        const value = input.value;
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(value)) {
            input.setCustomValidity('Please enter a valid email address.');
            return;
        }
        const domain = value.split('@')[1];
        if (domain !== 'gmail.com' && !domain.endsWith('.in')) {
            input.setCustomValidity('Email must be from gmail.com or end with .in');
        } else {
            input.setCustomValidity('');
        }
    }

    function validatePassword(input) {
        const value = input.value;
        const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{7,}$/;
        if (!regex.test(value) && value.length > 0) {
            input.setCustomValidity('Password must be at least 7 characters with uppercase, lowercase, number, and special symbol.');
        } else {
            input.setCustomValidity('');
        }
    }

    function validateSignupForm() {
        const name = document.querySelector('input[name="name"]');
        const email = document.querySelector('input[name="email"]');
        const password = document.querySelector('input[name="password"]');
        validateName(name);
        validateEmail(email);
        validatePassword(password);
        return name.checkValidity() && email.checkValidity() && password.checkValidity();
    }
</script>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
