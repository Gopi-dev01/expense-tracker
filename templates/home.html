<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body.home-body {
            background: #ffffff;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Glassmorphic Container for main home card */
        .home-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.45);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .home-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px var(--primary-shadow);
        }
        
        @media (max-width: 768px) {
            .home-card {
                width: 88% !important;
                padding: 25px 15px !important;
                margin: 30px auto !important;
            }
            .home-image img {
                width: 250px !important;
            }
            .bubbles-container {
                display: none !important;
            }
        }

        /* Floating Bubbles Styles */
        .bubbles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            border: 1px solid var(--bubble-border);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-shadow: 
                inset 0 10px 20px var(--bubble-shadow-1),
                inset 0 -10px 20px var(--bubble-shadow-2),
                0 10px 25px rgba(0, 0, 0, 0.05),
                0 4px 10px var(--bubble-shadow-3);
        }

        .bubble-1 {
            width: 120px;
            height: 120px;
            top: 15%;
            left: 10%;
            background: var(--bubble-grad-1);
            animation: float1 20s ease-in-out infinite;
        }

        .bubble-2 {
            width: 180px;
            height: 180px;
            top: 25%;
            right: 15%;
            background: var(--bubble-grad-2);
            animation: float2 25s ease-in-out infinite;
        }

        .bubble-3 {
            width: 90px;
            height: 90px;
            bottom: 20%;
            left: 20%;
            background: var(--bubble-grad-3);
            animation: float3 18s ease-in-out infinite;
        }

        .bubble-4 {
            width: 150px;
            height: 150px;
            bottom: 15%;
            right: 25%;
            background: var(--bubble-grad-4);
            animation: float4 22s ease-in-out infinite;
        }

        .bubble-5 {
            width: 70px;
            height: 70px;
            top: 50%;
            left: 45%;
            background: var(--bubble-grad-5);
            animation: float5 16s ease-in-out infinite;
        }

        .bubble-6 {
            width: 110px;
            height: 110px;
            bottom: 45%;
            right: 8%;
            background: var(--bubble-grad-6);
            animation: float6 24s ease-in-out infinite;
        }

        .bubble-7 {
            width: 170px;
            height: 170px;
            bottom: 40%;
            left: 6%;
            background: var(--bubble-grad-7);
            animation: float7 21s ease-in-out infinite;
        }

        @keyframes float1 {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            33% { transform: translate(30px, -50px) scale(1.08) rotate(120deg); }
            66% { transform: translate(-20px, 30px) scale(0.92) rotate(240deg); }
            100% { transform: translate(0, 0) scale(1) rotate(360deg); }
        }

        @keyframes float2 {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            25% { transform: translate(-40px, 40px) scale(0.95) rotate(-90deg); }
            50% { transform: translate(20px, -60px) scale(1.1) rotate(-180deg); }
            75% { transform: translate(-10px, -20px) scale(1.02) rotate(-270deg); }
            100% { transform: translate(0, 0) scale(1) rotate(-360deg); }
        }

        @keyframes float3 {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(50px, -30px) scale(1.15) rotate(180deg); }
            100% { transform: translate(0, 0) scale(1) rotate(360deg); }
        }

        @keyframes float4 {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            40% { transform: translate(-30px, -50px) scale(0.9) rotate(-120deg); }
            70% { transform: translate(25px, 20px) scale(1.05) rotate(-240deg); }
            100% { transform: translate(0, 0) scale(1) rotate(-360deg); }
        }

        @keyframes float5 {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(-20px, 40px) scale(0.92) rotate(180deg); }
            100% { transform: translate(0, 0) scale(1) rotate(360deg); }
        }

        @keyframes float6 {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            30% { transform: translate(40px, 30px) scale(1.1) rotate(90deg); }
            70% { transform: translate(-30px, -40px) scale(0.95) rotate(270deg); }
            100% { transform: translate(0, 0) scale(1) rotate(360deg); }
        }

        @keyframes float7 {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            35% { transform: translate(25px, 35px) scale(1.15) rotate(120deg); }
            70% { transform: translate(-15px, -30px) scale(0.85) rotate(240deg); }
            100% { transform: translate(0, 0) scale(1) rotate(360deg); }
        }
    </style>
</head>
<body class="home-body">

<div class="bubbles-container">
    <div class="bubble bubble-1"></div>
    <div class="bubble bubble-2"></div>
    <div class="bubble bubble-3"></div>
    <div class="bubble bubble-4"></div>
    <div class="bubble bubble-5"></div>
    <div class="bubble bubble-6"></div>
    <div class="bubble bubble-7"></div>
</div>

<nav class="navbar">
    <div class="logo" style="display: flex; align-items: center; gap: 5px;"><img src="{{ url_for('static', filename='images/logo.png', v='10') }}" alt="Logo" style="height: 55px; width: 55px; object-fit: contain; margin-right: -16px; transform: translateY(-6px);"><span>Expense Tracker</span></div>
    <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>
    <ul class="nav-links">
        <li class="active"><a href="/">Home</a></li>
        <li><a href="/signup">Signup</a></li>
        <li><a href="/login">Login</a></li>
    </ul>
</nav>

<section class="home-card">
    <h1>Welcome to My Expense Tracker</h1>
    <p>Track your daily expenses, manage income, and analyze spending easily.</p>
   <div class="home-image"><img src="{{ url_for('static', filename='images/expense_tracker.jpeg') }}" alt="Expense Tracker"></div> 
    <div class="home-buttons">
        <a href="/login" class="btn-primary">Login</a>
        <a href="/signup" class="btn-secondary">Signup</a>
    </div>
</section>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
